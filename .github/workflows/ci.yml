name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Pull requests from forks get no secrets: they run every check but the build.
      HAS_TMDB_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned in package.json (`packageManager`).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate lists
        run: pnpm validate:data

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build with TMDB data
        if: env.HAS_TMDB_TOKEN == 'true'
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: pnpm build
